; =============================================================================
; CSOPESY SMO2 - Desktop OS configuration
; Edit this file, save, then press Run again. NO RECOMPILING NEEDED.
;
; Format:  key = value       Comments start with ; or #
; Colors:  #RRGGBB, #RRGGBBAA, or r,g,b / r,g,b,a (0-255)
; Corners: top_left | top_right | bottom_left | bottom_right
; Missing or invalid values fall back to safe defaults (see console output).
; =============================================================================

[window]
title       = CSOPESY Desktop OS
mode        = windowed        ; windowed | borderless | fullscreen
width       = 1600            ; used in windowed mode (1280x720 = 720p recording)
height      = 900
resizable   = true
vsync       = true
block_close = true            ; true = only the PWR button can close the program

[ui]
theme = dark                  ; dark | light | classic
scale = 2.0                   ; text/UI size multiplier (1.0 = ImGui default)

[desktop]
wallpaper_mode     = gradient ; solid | gradient | pattern | image
margin             = 16       ; spacing (px) between screen edge and clock/PWR

solid_color        = #182C54

gradient_top       = #122048
gradient_bottom    = #408CBE
gradient_direction = vertical ; vertical | horizontal | diagonal

pattern_type       = grid     ; grid | dots | stripes (drawn over the gradient)
pattern_color      = 255,255,255,40
pattern_spacing    = 40       ; px between lines/dots (min 16)
pattern_thickness  = 1
pattern_speed      = 0        ; px per second the pattern drifts (0 = still)

image_path         = assets/wallpaper.png   ; relative to this file
image_fit          = fill     ; fill (keep aspect, crop) | stretch

[clock]
enabled      = true
corner       = top_right
format_24h   = true
show_seconds = true
show_date    = true
scale        = 2.5            ; clock text size relative to UI text
color        = #FFFFFF

[pwr]
label   = PWR
corner  = top_left
color   = #C82828
confirm = true                ; ask "Are you sure?" before shutting down

[taskbar]
position            = bottom     ; top | bottom
height              = 56         ; panel thickness in pixels
button_width        = 120
button_spacing      = 8
side_padding        = 12
background          = #12141CEB
border              = 255,255,255,25
button_color        = 255,255,255,16
button_hover        = 255,255,255,36
button_active       = 255,255,255,60
text_color          = #F0F0F0
indicator_color     = #50B4FF    ; colored bar under an open app
indicator_thickness = 3

[apps]
settings_title   = Settings
settings_icon    = Settings

explorer_title   = File Explorer
explorer_icon    = Files

taskmgr_title    = Task Manager
taskmgr_icon     = Task Mgr

settings_width   = 760
settings_height  = 540

explorer_width   = 960
explorer_height  = 600

taskmgr_width    = 1150
taskmgr_height   = 640

[about]
device_name  = CSOPESY-PC
processor    = Virtual CPU @ 3.20 GHz
ram          = 8.00 GB
system_type  = 64-bit operating system
device_id    = SMO2-0001-DLSU
product_id   = 00000-11111-22222-AAAAA
edition      = CSOPESY Desktop OS
version      = SMO2 (Build 2026.10)
os_build     = SMO2.0.1.0
experience   = Dear ImGui shell

[taskmgr]
; ---- Dummy-data generator (Task Manager, Stage 3) --------------------------
process_count      = 14       ; number of processes, 1..500
cpu_min            = 0        ; per-process CPU %, 0..100
cpu_max            = 8 
mem_min_mb         = 20       ; per-process memory in MB
mem_max_mb         = 600
refresh_ms         = 1000     ; how often values change; 0 = frozen
fluctuation        = 0.15     ; 0..1, how much values wobble each refresh
seed               = 0        ; 0 = random every run; other number = same values every run
suspended_count    = 1        ; how many processes show "Suspended"
; process_names: optional, comma-separated, e.g. Chrome, Spotify, Discord (leave empty for defaults)
process_names      =

; ---- Performance tab (defaults come from [about] processor / ram) ---------
; cpu_name         = Virtual CPU @ 3.20 GHz
; cpu_ghz          = 3.20
; total_memory_mb  = 8192
cores              = 4
logical_processors = 8
history_length     = 60       ; samples kept in the graphs

; ---- Look -------------------------------------------------------------------
default_tab        = processes ; processes | performance
show_disk_network  = true     ; Disk and Network columns
heatmap            = true     ; Windows-style yellow/orange usage cells
cpu_color          = #61ADFF  ; CPU text, graph and sparkline
memory_color       = #BF73F2  ; Memory text, graph and sparkline
disk_color         = #73D973
network_color      = #F2B34D
label_color        = #A6A6B3  ; dim labels (Suspended, card titles, footer)
heat_low           = #FFD940  ; usage cell color at low usage
heat_high          = #FF731A  ; usage cell color at high usage
