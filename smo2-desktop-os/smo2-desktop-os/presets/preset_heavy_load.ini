; Preset B: heavy load, 60 processes (tests scrolling), fast refresh, opens on Performance.
; Paste at the BOTTOM of config.ini (later keys win), run, then remove.
[taskmgr]
process_count   = 60
cpu_min         = 0.3
cpu_max         = 1.8
mem_min_mb      = 50
mem_max_mb      = 800
refresh_ms      = 250
fluctuation     = 0.5
suspended_count = 5
total_memory_mb = 32768
default_tab     = performance
